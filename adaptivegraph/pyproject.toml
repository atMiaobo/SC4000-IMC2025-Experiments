[project]
name = "adaptive-imc25"
version = "0.1.0"
description = "Adaptive scene-graph image matching pipeline for IMC 2025"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "pandas>=2.2,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "networkx>=3.3,<4",
  "tqdm>=4.66,<5",
  "timm>=1.0.20,<2",
  "huggingface-hub>=0.27,<1",
  "safetensors>=0.4,<1",
  "pycolmap==3.13.0",
  "matplotlib>=3.9,<4",
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.2,<5",
  "kaggle>=1.6,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
