# Aggressive fallback. Still uses our graph routing/triangle/topology logic, but spends
# far more compute on 5-view tile matching. Use if balanced is below your desired CV score.
name: adaptive_graph_high_score
retrieval:
  model_name: vit_base_patch14_dinov2.lvd142m
  batch_size: 8
  min_neighbors: 45
  max_neighbors: 60
  similarity_threshold: 0.18
matching:
  base_resize: 960
  max_keypoints: 4096
  detection_threshold: 0.005
  lightglue_filter_threshold: 0.18
  width_confidence: 0.99
  depth_confidence: -1.0
  ransac_reproj_threshold: 5.0
  ransac_max_iters: 50000
  strong_min_inliers: 45
  strong_min_ratio: 0.16
  strong_min_coverage: 0.05
  easy_inliers: 180
  easy_ratio: 0.70
  easy_coverage: 0.50
  triangle_borderline_inliers: 28
rescue:
  enable_tiles: true
  tile_resize: 1216
  full_tile_for_all_valid: true
  tile_trigger_min_inliers: 28
  tile_trigger_max_inliers: 10000
  tile_trigger_coverage: 0.55
  high_similarity_threshold: 0.35
  max_rescues_per_image: 55
  enable_rotation: true
  rotation_similarity_threshold: 0.48
  rotation_max_base_inliers: 50
  rotation_stop_inliers: 100
  low_degree_rescue: true
  low_degree_target: 3
  low_degree_extra_pairs: 4
graph:
  triangle_support_required_for_borderline: 1
  singleton_as_outlier: true
colmap:
  verify_max_error: 5.0
  verify_min_num_inliers: 15
  min_num_matches: 15
  min_model_size: 3
  max_num_models: 25
  init_min_num_inliers: 50
  abs_pose_min_num_inliers: 15
  abs_pose_min_inlier_ratio: 0.15
runtime:
  device: cuda
  seed: 2026
  use_amp: true
