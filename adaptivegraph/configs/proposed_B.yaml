# Proposed-B — backbone (loose gate, no triangle rehab, no rescue) + graph label propagation only.
# Isolates label propagation: the one graph component that improves clusterness
# without the triangle over-merge or rescue harm seen in A2/A3.
name: proposed_B_backbone_plus_propagation
retrieval:
  min_neighbors: 10
  max_neighbors: 18
  similarity_threshold: 0.24
  batch_size: 8
matching:
  base_resize: 960
  max_keypoints: 2048
  detection_threshold: 0.01
  lightglue_filter_threshold: 0.20
  strong_min_inliers: 45
  strong_min_ratio: 0.0
  strong_min_coverage: 0.0
  easy_inliers: 90
  easy_ratio: 0.48
  easy_coverage: 0.20
  triangle_borderline_inliers: 30
rescue:
  enable_tiles: false
  enable_rotation: false
  low_degree_rescue: false
  max_rescues_per_image: 0
graph:
  enable_triangle_support: false
  enable_label_propagation: true
colmap:
  init_min_num_inliers: 55
  abs_pose_min_num_inliers: 15
runtime:
  device: cuda
  use_amp: true
