# A3-naive — A2 + adaptive rescue (tiles/rotation/low-degree) with NO scene-preservation.
# Everything except the rescue block is identical to A2/fast, isolating the rescue effect.
# Expected: rescue raises within-scene mAA but merges doppelganger scenes -> clusterness drops.
name: ablation_A3_rescue_naive
retrieval:
  min_neighbors: 10
  max_neighbors: 18
  similarity_threshold: 0.24
  batch_size: 8
matching:
  base_resize: 960
  max_keypoints: 2048
  detection_threshold: 0.01
  lightglue_filter_threshold: 0.20
  strong_min_inliers: 45
  strong_min_ratio: 0.20
  strong_min_coverage: 0.06
  easy_inliers: 90
  easy_ratio: 0.48
  easy_coverage: 0.20
  triangle_borderline_inliers: 30
rescue:
  enable_tiles: true
  tile_resize: 1024
  full_tile_for_all_valid: false
  tile_trigger_min_inliers: 16
  tile_trigger_max_inliers: 150
  tile_trigger_coverage: 0.34
  high_similarity_threshold: 0.42
  max_rescues_per_image: 20
  enable_rotation: true
  rotation_similarity_threshold: 0.50
  rotation_max_base_inliers: 45
  rotation_stop_inliers: 90
  low_degree_rescue: true
  low_degree_target: 2
  low_degree_extra_pairs: 3
  scene_preserving: false
graph:
  enable_triangle_support: true
  enable_label_propagation: true
  triangle_support_required_for_borderline: 1
colmap:
  init_min_num_inliers: 55
  abs_pose_min_num_inliers: 15
runtime:
  device: cuda
  use_amp: true
