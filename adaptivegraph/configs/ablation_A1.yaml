# A1 — A0 + quality-aware gate: MAGSAC quality gate adds inlier-ratio + spatial-coverage
# requirements to edge acceptance (and quality ranking, inert until triangle/propagation on).
# Still NO triangle-support rehab, NO graph label propagation, NO rescue.
name: ablation_A1_quality_gate
retrieval:
  min_neighbors: 10
  max_neighbors: 18
  similarity_threshold: 0.24
  batch_size: 8
matching:
  base_resize: 960
  max_keypoints: 2048
  detection_threshold: 0.01
  lightglue_filter_threshold: 0.20
  strong_min_inliers: 45
  strong_min_ratio: 0.20
  strong_min_coverage: 0.06
  easy_inliers: 90
  easy_ratio: 0.48
  easy_coverage: 0.20
  triangle_borderline_inliers: 30
rescue:
  enable_tiles: false
  enable_rotation: false
  low_degree_rescue: false
  max_rescues_per_image: 0
graph:
  enable_triangle_support: false
  enable_label_propagation: false
colmap:
  init_min_num_inliers: 55
  abs_pose_min_num_inliers: 15
runtime:
  device: cuda
  use_amp: true
